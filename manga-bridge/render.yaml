services:
  - type: web
    name: resenhaflix-manga-bridge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://SEU-USUARIO.github.io
      - key: BRIDGE_SECRET
        generateValue: true
